<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>Padmasri Travels - Driver App</title>
<meta name="theme-color" content="#3E0B07" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@1,500;1,600;1,700&display=swap" rel="stylesheet">
<style>
  :root{
    /* Console design language - see index.html for the full note. Same
       tokens as the staff app so the driver/workshop portal reads as part
       of the same product, not a different app. */
    --ink:#1A1A18; --accent:#006643; --accent-dark:#004D33; --accent-light:#E1F0EA; --green:#2E7D32;
    --amber:#B8860B; --red:#C0392B; --grey:#6B6B62; --bg:#F6F6F2; --card:#ffffff;
    --border:#E6E3DB; --purple:#6C63FF; --purple-dark:#4A43C7; --purple-light:#E7E5FF;
    --gold:#C9A227; --gold-light:#F6ECD2; --wordmark:#7A2115;
    --label-track:.09em; --label-size:11px;
    --on-accent:#ffffff; --on-accent-rgb:255,255,255; --accent-text:var(--accent);
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Figtree','Poppins',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);-webkit-tap-highlight-color:transparent;}
  .accent-script{font-family:'Playfair Display',Georgia,serif;font-style:italic;font-weight:600;}
  #app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);padding-bottom:40px;}
  header.topbar{background:var(--card);color:var(--ink);padding:16px 18px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10;border-bottom:1px solid var(--border);}
  header.topbar .brand{font-weight:800;font-size:15px;display:flex;align-items:center;gap:8px;color:var(--wordmark);}
  header.topbar .brand .brand-logo{height:26px;width:auto;display:block;}
  header.topbar .who{font-size:var(--label-size);color:var(--grey);text-align:right;text-transform:uppercase;letter-spacing:var(--label-track);font-weight:700;}
  main{padding:16px;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:none;}
  h1.page-title{font-size:19px;font-weight:800;margin:2px 0 16px;color:var(--ink);text-align:center;}
  h2.section-title{font-size:10.5px;margin:0 0 12px;color:var(--grey);text-transform:uppercase;letter-spacing:var(--label-track);font-weight:800;border-bottom:1px solid var(--border);padding-bottom:8px;}
  .muted{color:var(--grey);font-size:12.5px;}
  /* Company Hierarchy tree (see Profile tab) - same pure-CSS nested-list
     technique as the staff app, sized down for a narrow phone screen. */
  .org-tree-wrap{overflow-x:auto;padding:10px 0;}
  .org-tree, .org-tree ul{display:flex;justify-content:center;list-style:none;margin:0;padding:0;}
  .org-tree li{display:flex;flex-direction:column;align-items:center;padding:18px 6px 0 6px;position:relative;}
  .org-tree li::before, .org-tree li::after{content:'';position:absolute;top:0;right:50%;border-top:2px solid var(--border);width:50%;height:18px;}
  .org-tree li::after{right:auto;left:50%;border-left:2px solid var(--border);}
  .org-tree li:only-child{padding-top:0;}
  .org-tree li:only-child::before, .org-tree li:only-child::after{display:none;}
  .org-tree > li:first-child::before, .org-tree > li:last-child::after{border:0 none;}
  .org-tree li:first-child::after{border-radius:5px 0 0 0;}
  .org-tree li:last-child::before{border-right:2px solid var(--border);border-radius:0 5px 0 0;}
  .org-tree ul ul::before{content:'';position:absolute;top:0;left:50%;border-left:2px solid var(--border);width:0;height:18px;}
  .org-box{border:1px solid var(--border);border-radius:8px;background:#fff;padding:6px 9px;min-width:88px;font-size:11px;}
  .org-box .org-role{font-size:9.5px;color:var(--grey);text-transform:uppercase;letter-spacing:.03em;margin-bottom:2px;}
  .org-box .org-name{font-weight:700;font-size:11.5px;}
  .org-box .org-phone{font-size:9.5px;color:var(--grey);}
  .org-box.org-vacant{border-style:dashed;color:var(--grey);font-style:italic;}
  .org-box.org-summary{background:var(--accent-light);}
  .banner{background:#FBF1DE;border:1px solid #EEDDB8;color:#8A5F16;padding:12px 14px;border-radius:12px;font-size:13.5px;margin-bottom:16px;}
  .banner.error{background:#FBEAE6;border-color:#F3C6BA;color:#A83B1C;}
  .banner.ok{background:var(--accent-light);border-color:#CFE3D8;color:var(--accent-dark);}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--grey);margin-bottom:6px;font-weight:700;}
  .field input{width:100%;padding:14px 12px;border:1px solid var(--border);background:#fff;border-radius:14px;font-size:18px;text-align:center;letter-spacing:1px;}
  .field select{width:100%;padding:14px 12px;border:1px solid var(--border);background:#fff;border-radius:14px;font-size:15px;text-align:left;letter-spacing:normal;}
  .field.left input{text-align:left;letter-spacing:normal;font-size:15px;}
  .big-btn{width:100%;background:var(--accent);color:var(--on-accent);border:none;padding:16px;border-radius:14px;font-size:14.5px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;cursor:pointer;}
  .big-btn:hover{background:var(--accent-dark);}
  .big-btn:disabled{opacity:.45;cursor:not-allowed;}
  .big-btn.secondary{background:#fff;color:var(--accent-text);border:2px solid var(--accent-text);}
  .big-btn.danger{background:var(--red);}
  .swipe-track{position:relative;width:100%;height:58px;background:var(--accent-light);border:1px solid var(--border);border-radius:29px;overflow:hidden;margin-top:6px;user-select:none;}
  .swipe-track .swipe-label{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--ink);font-weight:700;font-size:14px;letter-spacing:.3px;pointer-events:none;}
  .swipe-track.logout .swipe-label{color:#fff;}
  .swipe-track.logout{background:#f6d9d4;}
  .swipe-thumb{position:absolute;top:3px;left:3px;width:52px;height:52px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;font-size:20px;cursor:grab;box-shadow:0 1px 4px rgba(0,0,0,.25);touch-action:none;}
  .swipe-track.logout .swipe-thumb{background:var(--red);}
  .countdown{font-size:34px;font-weight:800;color:var(--ink);text-align:center;margin:6px 0 14px;letter-spacing:1px;}
  .countdown.warn{color:var(--red);}
  .photo-box{border:2px dashed #C9C2A0;border-radius:14px;padding:14px;text-align:center;background:#FCFBF2;margin-bottom:14px;}
  .photo-box img{max-width:100%;max-height:180px;border-radius:8px;margin-top:10px;}
  .trip-item{border:1px solid var(--border);border-radius:14px;padding:12px 14px;margin-bottom:10px;}
  .trip-item .date{font-weight:700;color:var(--ink);font-size:14px;}
  .trip-item .desc{font-size:13px;color:#333;margin-top:2px;}
  .trip-item .meta{font-size:11.5px;color:var(--grey);margin-top:4px;}
  .badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:10.5px;font-weight:800;margin-top:6px;text-transform:uppercase;letter-spacing:.05em;border:1px solid transparent;}
  .badge.upcoming{background:#FBF1DE;color:#9C6B10;border-color:#EEDDB8;}
  .badge.in_progress{background:var(--purple-light);color:var(--purple-dark);border-color:#D6D3FF;}
  .badge.completed{background:var(--accent-light);color:var(--accent);border-color:#CFE3D8;}
  .badge.pending{background:#FBF1DE;color:#9C6B10;border-color:#EEDDB8;}
  .badge.approved{background:var(--accent-light);color:var(--accent);border-color:#CFE3D8;}
  .badge.rejected{background:#FBEAE6;color:var(--red);border-color:#F3C6BA;}
  .badge.cancelled{background:#FBEAE6;color:var(--red);border-color:#F3C6BA;}
  .driver-tabbar{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px;-webkit-overflow-scrolling:touch;padding-bottom:2px;}
  .driver-tabbar button{flex:0 0 auto;background:#fff;border:1px solid var(--border);color:var(--grey);padding:9px 14px;border-radius:20px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;cursor:pointer;white-space:nowrap;}
  .driver-tabbar button.active{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:800;}
  .trip-point{margin-top:10px;padding:10px 12px;background:#FCFBF2;border:1px solid var(--border);border-radius:12px;}
  .trip-point-label{font-size:11px;font-weight:700;color:var(--accent-text);text-transform:uppercase;letter-spacing:.4px;}
  .trip-point a{font-size:12px;}
  .doc-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #F1ECD4;font-size:13px;}
  .doc-row:last-child{border-bottom:none;}
  .doc-row .dl-link{background:var(--accent);color:var(--on-accent);padding:7px 12px;border-radius:8px;font-size:12px;font-weight:600;text-decoration:none;white-space:nowrap;}
  table{width:100%;border-collapse:collapse;font-size:12.5px;}
  table th{text-align:left;padding:7px 5px;color:var(--grey);border-bottom:1px solid var(--border);font-size:10px;text-transform:uppercase;letter-spacing:var(--label-track);font-weight:800;}
  table td{padding:7px 5px;border-bottom:1px solid #F1ECD4;}
  .trip-actions{margin-top:10px;display:flex;gap:8px;}
  .trip-actions button{flex:1;padding:9px;border-radius:10px;border:1px solid var(--accent-text);background:#fff;color:var(--accent-text);font-size:12.5px;font-weight:600;cursor:pointer;}
  .empty{text-align:center;color:var(--grey);padding:20px 10px;font-size:13px;}
  .status-pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--grey);}
  .status-pill .dot{width:8px;height:8px;border-radius:50%;background:var(--green);}
  .status-pill .dot.off{background:#c9c9c9;}
  .footer-note{font-size:11px;color:#9a9576;text-align:center;padding:18px 10px 4px;}
  .footer-note a{color:var(--accent-text);}
  .month-picker{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
  .month-picker input{flex:1;padding:10px;border:1px solid var(--border);border-radius:10px;font-size:14px;}
  .payslip-row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #F1ECD4;font-size:13.5px;}
  .payslip-row.total{font-weight:700;color:var(--ink);border-top:2px solid var(--border);border-bottom:none;padding-top:10px;margin-top:4px;}
  .dl-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px;}
  .dl-row button{min-width:100px;}
  .dl-row button{flex:1;}
  .spinner{display:inline-block;width:14px;height:14px;border:2px solid #ccc;border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:6px;}
  @keyframes spin{to{transform:rotate(360deg);}}
  /* ---- Fleet Assistant (workshop portal) ---- */
  .ws-ai-hero{background:linear-gradient(135deg,var(--purple-light),#fff);border:1px solid var(--border);border-radius:18px;padding:16px 18px;margin-bottom:14px;}
  .ws-ai-hero h1{font-size:17px;margin:0 0 4px;color:var(--ink);}
  .ws-ai-hero p{font-size:12.5px;color:var(--grey);margin:0;}
  .ws-ai-chat-window{max-height:340px;overflow-y:auto;margin-bottom:12px;}
  .ws-ai-msg{padding:10px 12px;border-radius:12px;font-size:13px;line-height:1.5;margin-bottom:8px;white-space:pre-wrap;}
  .ws-ai-msg.user{background:var(--accent-light);color:var(--ink);margin-left:20%;}
  .ws-ai-msg.assistant{background:#F4F2FF;border:1px solid var(--purple-light);}
  .ws-ai-tag{display:block;font-size:10.5px;font-weight:700;color:var(--purple);text-transform:uppercase;letter-spacing:.4px;margin-bottom:3px;}
  .ws-ai-tools-used{font-size:10.5px;color:var(--grey);margin-top:5px;}
  .ws-ai-suggest-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;}
  .ws-ai-suggest-chip{background:#fff;border:1px solid var(--purple-light);color:var(--purple);padding:7px 12px;border-radius:16px;font-size:11.5px;font-weight:600;cursor:pointer;}
  .ws-ai-input-row textarea{width:100%;padding:12px;border:1px solid var(--border);border-radius:14px;font-size:14px;resize:vertical;min-height:52px;margin-bottom:10px;font-family:inherit;}
</style>
</head>
<body>
<div id="app"></div>
<input type="file" id="odoOpenInput" accept="image/*" capture="environment" style="display:none" />
<input type="file" id="odoCloseInput" accept="image/*" capture="environment" style="display:none" />
<script>
/* =========================================================================
   PADMASRI TRAVELS - DRIVER + WORKSHOP STAFF APP
   Deliberately separate from index.html and its login system: Drivers and
   Workshop staff (Manager, Supervisor, Mechanic, Helper, Electrician) don't
   have email addresses and aren't trained on the full staff app, so they
   all sign in here with just their mobile number + a 4-digit PIN (default
   1234, never forced to change - see server.js backfillDefaults for why).
   One combined login form (see doPortalLogin) tries /api/driver-auth/login
   first, then falls back to /api/workshop-auth/login - the same phone+PIN
   the person types works for whichever portal their account belongs to,
   so nobody has to know or care which "kind" of login they have.
   `portalType` ("driver" | "workshop") tracks which session is active and
   is what every render/boot function below branches on. The two sessions
   (driverSessions vs workshopSessions on the server) are completely
   independent - a phone number only ever matches one or the other.
   ========================================================================= */

const API = "/api";
let portalType = localStorage.getItem("portalType") || null; // "driver" | "workshop"
let driverToken = localStorage.getItem("driverAuthToken") || null;
let driver = null;
let shift = null;
let workshopToken = localStorage.getItem("workshopAuthToken") || null;
let workshopUser = null;
let workshopTab = "myrepairs";
let workshopRequests = [];
let workshopPurchases = [];
let workshopStaffList = [];
let workshopBusy = false;
let pendingWorkshopInvoice = null;

// ---------- theme (fixed brand-color picker, mirrors server.js/index.html) ----------
const THEME_PRESETS = {
  teal:   { key:"teal",   label:"Teal",          accent:"#00A3A6", text:"#FFFFFF" },
  lime:   { key:"lime",   label:"Lime",          accent:"#D7E600", text:"#1A1A1A" },
  maroon: { key:"maroon", label:"Padma Sri Maroon", accent:"#5D110B", text:"#FFFFFF" },
  gold:   { key:"gold",   label:"Golden Yellow", accent:"#FFC107", text:"#1A1A1A" },
  black:  { key:"black",  label:"Black",         accent:"#000000", text:"#FFFFFF" },
  white:  { key:"white",  label:"White",         accent:"#FFFFFF", text:"#1A1A1A" },
};
function hexToRgbDriver(hex){
  const h = hex.replace("#","");
  const n = h.length===3 ? h.split("").map(c=>c+c).join("") : h;
  const int = parseInt(n,16);
  return { r:(int>>16)&255, g:(int>>8)&255, b:int&255 };
}
function shadeHexDriver(hex, pct){
  const {r,g,b} = hexToRgbDriver(hex);
  const f = pct<0 ? 0 : 255, p = Math.abs(pct);
  const nr = Math.round((f-r)*p)+r, ng = Math.round((f-g)*p)+g, nb = Math.round((f-b)*p)+b;
  return "#"+[nr,ng,nb].map(x=>Math.max(0,Math.min(255,x)).toString(16).padStart(2,"0")).join("");
}
function applyTheme(themeKey){
  const root = document.documentElement.style;
  if(!themeKey || !THEME_PRESETS[themeKey]){
    root.removeProperty("--accent");
    root.removeProperty("--accent-dark");
    root.removeProperty("--accent-light");
    root.removeProperty("--on-accent");
    root.removeProperty("--on-accent-rgb");
    root.removeProperty("--accent-text");
    try{ localStorage.removeItem("themeKey"); }catch(e){}
    return;
  }
  const preset = THEME_PRESETS[themeKey];
  const { r, g, b } = hexToRgbDriver(preset.text);
  root.setProperty("--accent", preset.accent);
  root.setProperty("--accent-dark", shadeHexDriver(preset.accent, -0.2));
  root.setProperty("--accent-light", shadeHexDriver(preset.accent, 0.75));
  root.setProperty("--on-accent", preset.text);
  root.setProperty("--on-accent-rgb", `${r},${g},${b}`);
  root.setProperty("--accent-text", preset.accent);
  try{ localStorage.setItem("themeKey", themeKey); }catch(e){}
}
(function(){
  try{
    const saved = localStorage.getItem("themeKey");
    if(saved && THEME_PRESETS[saved]) applyTheme(saved);
  }catch(e){}
})();
async function saveDriverTheme(key){
  try{
    const updated = await api("/driver-auth/theme", {method:"POST", body:JSON.stringify({theme:key})});
    driver.theme = updated.theme;
    applyTheme(key);
    render();
  }catch(e){ alert(e.message||"Could not update theme."); }
}
async function resetDriverTheme(){
  try{
    const updated = await api("/driver-auth/theme", {method:"POST", body:JSON.stringify({theme:null})});
    driver.theme = updated.theme;
    applyTheme(null);
    render();
  }catch(e){ alert(e.message||"Could not reset theme."); }
}
async function saveWorkshopTheme(key){
  try{
    const updated = await workshopApi("/workshop-auth/theme", {method:"POST", body:JSON.stringify({theme:key})});
    workshopUser.theme = updated.theme;
    applyTheme(key);
    render();
  }catch(e){ alert(e.message||"Could not update theme."); }
}
async function resetWorkshopTheme(){
  try{
    const updated = await workshopApi("/workshop-auth/theme", {method:"POST", body:JSON.stringify({theme:null})});
    workshopUser.theme = updated.theme;
    applyTheme(null);
    render();
  }catch(e){ alert(e.message||"Could not reset theme."); }
}
function themePickerHtml(currentThemeObj, saveFn, resetFn){
  const current = (currentThemeObj && currentThemeObj.key) || null;
  const swatches = Object.values(THEME_PRESETS).map(p=>{
    const sel = p.key===current;
    return `<button type="button" onclick="${saveFn}('${p.key}')" title="${p.label}" style="width:38px;height:38px;border-radius:50%;background:${p.accent};border:${sel?"3px solid var(--ink)":"1px solid var(--border)"};cursor:pointer;box-shadow:${sel?"0 0 0 2px #fff inset":"none"};"></button>`;
  }).join("");
  return `<div class="card">
    <h3 style="margin-top:0;">Theme</h3>
    <p class="muted" style="margin-bottom:10px;font-size:12.5px;">Pick an accent color for your account.</p>
    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;">${swatches}
      <button type="button" class="big-btn secondary" style="width:auto;padding:8px 14px;font-size:12.5px;" onclick="${resetFn}()">Reset</button>
    </div>
  </div>`;
}

// Free, built-in Fleet Assistant (no paid API) - same rule-based backend
// the main staff app uses, just reached through the Workshop token instead.
let wsChatHistory = []; // [{role:"user"|"assistant", content:string, tool?:string}]
let wsChatBusy = false;
let wsChatError = "";
function escapeHtmlWs(str){
  return String(str==null?"":str).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
let lastError = "";
// Which sub-tab is showing once the shift is active (on_trip/ready_to_logout).
let driverTab = "current";
let currentTrip = null;
let tripsMonth = new Date().toISOString().slice(0,7);
let monthTrips = { upcoming: [], completed: [] };
// Employee Transport pickup/drop routes dispatched to this driver - a
// separate concept from the regular `trips` above (multi-stop, per-
// employee board/no-show). See /api/driver-auth/transport-routes*.
let transportTrips = { upcoming: [], current: [], completed: [] };
// On-demand, point-to-point cab ride assigned to this driver (auto-matched
// by nearest-available-driver when requested) - a genuinely different
// concept from transportTrips above (one passenger, no stops, requested
// ad-hoc). See /api/driver-auth/cab-rides*.
let cabRide = null;
// In-progress boarding-code text per stop, keyed "routeId_seq" - kept
// outside the trip data itself so a background poll/render mid-typing
// doesn't wipe out what the driver has entered so far (same reasoning as
// odoOpenDraft/odoCloseDraft below).
let transportBoardCodeDrafts = {};
// Completed Employee Transport trip history, browsable by day/week/month -
// separate from transportTrips.completed above (which is just a 20-row
// "recent activity" preview) - see fetchTransportHistory().
let transportHistoryRangeType = "day";
let transportHistoryValue = new Date().toISOString().slice(0,10);
let transportHistoryTrips = [];
let myLeaveRequests = [];
let attendanceMonth = new Date().toISOString().slice(0,7);
let attendanceRows = [];
let documentsData = null;
const DOC_TYPE_LABELS = { RC:"RC", Permit:"Permit", Insurance:"Insurance", Fitness:"Fitness Certificate", Tax:"Road Tax", PUC:"PUC", TemporaryPermit:"Temporary Permit", BorderTax:"Border Tax" };
let lastPos = { lat: null, lng: null };
let locationOk = false;
let pingTimer = null;
let pollTimer = null;
let capturedOpenPhoto = null;
let capturedClosePhoto = null;
// Whatever the driver has typed so far into the odometer fields, kept
// outside the DOM so a re-render (the countdown ticking, a location poll,
// a photo capture completing) never wipes out an in-progress reading.
let odoOpenDraft = "";
let odoCloseDraft = "";
let busy = false;
let payslipMonth = new Date().toISOString().slice(0,7);
let payslip = null;
let payslipLoading = false;

async function api(path, opts={}){
  const headers = Object.assign({"Content-Type":"application/json"}, opts.headers||{});
  if(driverToken) headers["Authorization"] = "Bearer " + driverToken;
  const res = await fetch(API+path, Object.assign({}, opts, {headers}));
  if(res.status === 401){
    resetSession();
    render();
    throw new Error("Session expired - please log in again.");
  }
  const data = await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(data.error || ("Request failed ("+res.status+")"));
  return data;
}

// ---------- push notifications (dispatched trips) ----------
// Best-effort: silently gives up on browsers/contexts that don't support
// it (no service worker, HTTP instead of HTTPS, permission denied) - the
// 15s poll on Upcoming Trips still shows a newly-dispatched trip either
// way, this just means the driver also gets it as a native notification
// even with the app closed / phone locked.
function urlBase64ToUint8Array(base64String){
  const padding = "=".repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g,"+").replace(/_/g,"/");
  const rawData = atob(base64);
  const arr = new Uint8Array(rawData.length);
  for(let i=0;i<rawData.length;i++) arr[i] = rawData.charCodeAt(i);
  return arr;
}
async function subscribeToPush(){
  try{
    if(!("serviceWorker" in navigator) || !("PushManager" in window)) return;
    if(typeof Notification==="undefined" || Notification.permission==="denied") return;
    const reg = await navigator.serviceWorker.register("/driver-sw.js");
    let permission = Notification.permission;
    if(permission==="default") permission = await Notification.requestPermission();
    if(permission!=="granted") return;
    let sub = await reg.pushManager.getSubscription();
    if(!sub){
      const { publicKey } = await api("/driver-auth/vapid-public-key");
      if(!publicKey) return;
      sub = await reg.pushManager.subscribe({ userVisibleOnly:true, applicationServerKey: urlBase64ToUint8Array(publicKey) });
    }
    await api("/driver-auth/push-subscribe", {method:"POST", body: JSON.stringify(sub.toJSON())});
  }catch(e){ console.warn("Push subscribe skipped:", e.message); }
}

// ---------- location ----------
function getPosition(timeoutMs){
  return new Promise((resolve)=>{
    if(!navigator.geolocation){ resolve({lat:null,lng:null}); return; }
    const timer = setTimeout(()=>resolve({lat:lastPos.lat,lng:lastPos.lng}), timeoutMs||8000);
    navigator.geolocation.getCurrentPosition(
      (pos)=>{
        clearTimeout(timer);
        const p = {lat: pos.coords.latitude, lng: pos.coords.longitude};
        lastPos = p; locationOk = true;
        resolve(p);
      },
      ()=>{ clearTimeout(timer); locationOk = false; resolve({lat:lastPos.lat,lng:lastPos.lng}); },
      {enableHighAccuracy:true, timeout:(timeoutMs||8000)-500, maximumAge:5000}
    );
  });
}
function startLocationPings(){

    api("/driver-auth/location-ping", {method:"POST", body: JSON.stringify(p)}).catch(()=>{});

}

// ---------- Employee Transport completed-trip history (day/week/month) ----------
// The date input's format differs by range type (<input type=date|week|month>),
// so transportHistoryValue holds whatever raw string that control produces;
// this turns it into the from/to (YYYY-MM-DD) pair the server actually filters on.
function isoWeekStringFor(date){
  const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
  const dayNum = d.getUTCDay() || 7;
  d.setUTCDate(d.getUTCDate() + 4 - dayNum);
  const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
  const weekNo = Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
  return `${d.getUTCFullYear()}-W${String(weekNo).padStart(2,"0")}`;
}
function computeHistoryRange(type, value){
  if(type==="month"){
    const m = /^\d{4}-\d{2}$/.test(value) ? value : new Date().toISOString().slice(0,7);
    const [y,mo] = m.split("-").map(Number);
    const lastDay = new Date(y, mo, 0).getDate();
    return { from: `${m}-01`, to: `${m}-${String(lastDay).padStart(2,"0")}` };
  }
  if(type==="week"){
    const w = /^\d{4}-W\d{2}$/.test(value) ? value : isoWeekStringFor(new Date());
    const [yStr, wStr] = w.split("-W");
    const y = Number(yStr), wk = Number(wStr);
    const jan4 = new Date(Date.UTC(y,0,4));
    const jan4Day = jan4.getUTCDay() || 7;
    const week1Monday = new Date(jan4); week1Monday.setUTCDate(jan4.getUTCDate() - jan4Day + 1);
    const monday = new Date(week1Monday); monday.setUTCDate(week1Monday.getUTCDate() + (wk-1)*7);
    const sunday = new Date(monday); sunday.setUTCDate(monday.getUTCDate()+6);
    const fmtIso = (d)=> d.toISOString().slice(0,10);
    return { from: fmtIso(monday), to: fmtIso(sunday) };
  }
  const d = /^\d{4}-\d{2}-\d{2}$/.test(value) ? value : new Date().toISOString().slice(0,10);
  return { from: d, to: d };
}
async function fetchTransportHistory(){
  const {from, to} = computeHistoryRange(transportHistoryRangeType, transportHistoryValue);
  try{ const r = await api(`/driver-auth/transport-routes/history?from=${from}&to=${to}`); transportHistoryTrips = r.trips || []; }

function hierarchyTreeHtml(data){
  const opsExec = data.executives.find(e=>e.role==="ops_manager");
  const otherExecs = data.executives.filter(e=>e.role!=="ops_manager");

  const areaLi = (a) => `<li>${orgBox("Area Supervisor",[a], `${a.vehicleCount} vehicle${a.vehicleCount===1?'':'s'}`)}</li>`;
  const regionalLi = (rs) => {
    const children = rs.areas.map(areaLi).join("");
    return `<li>
      ${orgBox("Regional Supervisor",[rs], rs.ownVehicleCount ? `+ ${rs.ownVehicleCount} own vehicle${rs.ownVehicleCount===1?'':'s'}` : '')}
      ${children ? `<ul>${children}</ul>` : ""}
    </li>`;
  };
  const driversLi = `<li>${orgSummaryBox("Drivers", `${data.totalDrivers} active driver${data.totalDrivers===1?'':'s'} - report to their Area Supervisor`)}</li>`;
  const opsChildren = data.regionalSupervisors.map(regionalLi).join("") + data.unassignedAreas.map(areaLi).join("") + driversLi;
  const opsLi = `<li>
    ${orgBox("Operations Manager", opsExec ? opsExec.people : [])}
    <ul>${opsChildren}</ul>
  </li>`;

  const execLis = otherExecs.map(e=>`<li>${orgBox(e.label, e.people)}</li>`).join("");

  const wsStaffLis = orgWorkshopStaffLis(data.workshop.staff);
  const wsSupLis = data.workshop.supervisors.length
    ? data.workshop.supervisors.map(s=>`<li>${orgBox("Workshop Supervisor",[s])}<ul>${wsStaffLis}</ul></li>`).join("")
    : `<li>${orgBox("Workshop Supervisor",[])}<ul>${wsStaffLis}</ul></li>`;
  const workshopLi = `<li>
    ${orgBox("Workshop Manager", data.workshop.managers)}
    <ul>${wsSupLis}</ul>
  </li>`;

  return `<ul class="org-tree"><li>
    ${orgBox("Owner", data.owner)}
    <ul>${opsLi}${execLis}${workshopLi}</ul>
  </li></ul>`;
}

// ---------- image capture (matches the supervisor app's downscale pattern) ----------
function downscaleImage(file, maxW, quality, cb){
  const reader = new FileReader();
  reader.onload = (ev)=>{
    const img = new Image();
    img.onload = ()=>{
      const scale = Math.min(1, maxW/img.width);
      const canvas = document.createElement("canvas");
      canvas.width = img.width*scale; canvas.height = img.height*scale;
      canvas.getContext("2d").drawImage(img,0,0,canvas.width,canvas.height);
      cb(canvas.toDataURL("image/jpeg",quality));
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

// ---------- swipe-to-confirm control ----------
// A simple slide-to-confirm gesture (pointer events, works for touch and
// mouse) - deliberately the only way to log in/out, since a plain button
// tap is too easy to fire by accident while the phone is being handled.
function initSwipe(trackId, onConfirm){
  const track = document.getElementById(trackId);
  if(!track) return;
  const thumb = track.querySelector(".swipe-thumb");
  const maxX = track.clientWidth - thumb.clientWidth - 6;
  let startX = 0, curX = 0, dragging = false;
  function setX(x){ curX = Math.max(0, Math.min(maxX, x)); thumb.style.transform = `translateX(${curX}px)`; }
  function onDown(e){
    dragging = true;
    startX = (e.touches? e.touches[0].clientX : e.clientX) - curX;
    thumb.style.cursor = "grabbing";
  }
  function onMove(e){
    if(!dragging) return;
    const x = (e.touches? e.touches[0].clientX : e.clientX) - startX;
    setX(x);
  }
  function onUp(){
    if(!dragging) return;
    dragging = false;
    thumb.style.cursor = "grab";
    if(curX >= maxX*0.82){
      setX(maxX);
      onConfirm();
    } else {
      setX(0);
    }
  }
  thumb.addEventListener("mousedown", onDown);
  window.addEventListener("mousemove", onMove);
  window.addEventListener("mouseup", onUp);
  thumb.addEventListener("touchstart", onDown, {passive:true});
  window.addEventListener("touchmove", onMove, {passive:true});
  window.addEventListener("touchend", onUp);
  setX(0);
}

// One combined login: try the Driver session first (the common case), then
// fall back to Workshop staff - same phone+PIN form, no portal picker,
// per the Owner's explicit choice to combine the two mobile logins.
async function doPortalLogin(){
  if(busy) return;
  lastError = "";
  const phone = (document.getElementById("driverPhone")||{}).value || "";
  const pin = (document.getElementById("driverPin")||{}).value || "";
  if(!phone.trim() || !pin.trim()){ lastError = "Enter your mobile number and PIN."; render(); return; }
  busy = true; render();
  const pos = await getPosition(6000);
  try{
    const r = await api("/driver-auth/login", {method:"POST", body: JSON.stringify({phone: phone.trim(), pin: pin.trim(), lat: pos.lat, lng: pos.lng})});
    driverToken = r.token; driver = r.driver; shift = r.shift;
    portalType = "driver";
    localStorage.setItem("driverAuthToken", driverToken);
    localStorage.setItem("portalType", "driver");
    startLocationPings(); startPolling();
    subscribeToPush();
    driverTab = "current";
    await fetchCurrentTrip();
    busy = false; render();
    return;
  }catch(driverErr){
    // Not a driver (or wrong PIN) - try Workshop staff before giving up.
  }
  try{
    const r2 = await workshopApi("/workshop-auth/login", {method:"POST", body: JSON.stringify({phone: phone.trim(), pin: pin.trim()})});
    workshopToken = r2.token; workshopUser = r2.user;
    portalType = "workshop";
    localStorage.setItem("workshopAuthToken", workshopToken);
    localStorage.setItem("portalType", "workshop");
    workshopTab = WORKSHOP_MANAGER_ROLES.includes(workshopUser.role) ? "queue" : "myrepairs";
    await loadWorkshopTabData();
  }catch(workshopErr){
    lastError = "Incorrect mobile number or PIN.";
  }
  busy = false; render();
}

    if(driverToken) headers["Authorization"] = "Bearer " + driverToken;
    const res = await fetch(`${API}/driver-auth/payslip/download?month=${payslipMonth}&format=${format}`, {headers});
    if(!res.ok){ const d = await res.json().catch(()=>({})); throw new Error(d.error || "Download failed."); }
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = `payslip_${payslipMonth}.${format==="xlsx"?"xlsx":format==="pdf"?"pdf":"csv"}`;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  }catch(e){ alert(e.message); }
}

// ---------- rendering ----------
function money(n){ return "₹" + Math.round(n||0).toLocaleString("en-IN"); }
function fmtTime(iso){ if(!iso) return "-"; const d = new Date(iso); return d.toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit"}); }
function fmtDate(s){ if(!s) return "-"; const d = new Date(s+"T00:00:00"); return d.toLocaleDateString("en-IN",{day:"2-digit",month:"short"}); }
// Full DD/MM/YYYY display (distinct from the compact fmtDate() above, which
// is a deliberate "28 Jul" style used on trip cards) - use this wherever a
// full date needs to be shown, e.g. document expiry.
function fmtDMY(dateStr){
  if(!dateStr) return "-";
  const m = String(dateStr).slice(0,10).match(/^(\d{4})-(\d{2})-(\d{2})$/);
  return m ? `${m[3]}/${m[2]}/${m[1]}` : String(dateStr);
}

function odometerCountdownParts(){

// ---------- Employee Transport - accepted trip, per-stop board/no-show ----------
// A stop starts "pending" -> arrival is usually detected automatically once
// the driver's own GPS gets within ~200m of the stop (see
// checkTransportProximity() server-side), but "Arrived Here" is still here
// as a manual fallback for when GPS is off/inaccurate. Once arrived, the
// employee reads their 4-digit boarding code out loud and the driver types
// it in to confirm the pickup (Confirm Pickup) - or "Mark No Show" once the
// 5-minute grace period has passed (enforced both here and server-side) -
// so the driver is never stuck waiting indefinitely for one employee.
function transportStopRowHtml(routeId, s){
  const badge = s.boardStatus==="boarded" ? `<span class="badge completed">Boarded</span>`
    : s.boardStatus==="no_show" ? `<span class="badge cancelled">No Show</span>`
    : `<span class="badge upcoming">Pending</span>`;
  let actions = "";
  if(s.boardStatus==="pending"){
    if(!s.arrivedAt){
      actions = `<button ${busy?"disabled":""} onclick="markStopArrived('${routeId}',${s.seq})">${busy?'<span class="spinner"></span>':"Arrived Here"}</button>`;
    } else {
      const remainMs = Math.max(0, new Date(s.arrivedAt).getTime() + 5*60*1000 - Date.now());
      const key = routeId+"_"+s.seq;
      const draft = transportBoardCodeDrafts[key] || "";
      actions = `
        <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:8px;">
          <input type="tel" inputmode="numeric" maxlength="4" placeholder="Employee's code" value="${draft}" style="width:120px;"
            oninput="transportBoardCodeDrafts['${key}']=this.value.replace(/\\D/g,'').slice(0,4)"/>
          <button ${busy?"disabled":""} onclick="markStopBoarded('${routeId}',${s.seq})">${busy?'<span class="spinner"></span>':"Confirm Pickup"}</button>
        </div>
        <button id="noShowBtn_${routeId}_${s.seq}" data-arrived="${s.arrivedAt}" ${(busy||remainMs>0)?"disabled":""} onclick="markStopNoShow('${routeId}',${s.seq})">
          <span id="noShowLabel_${routeId}_${s.seq}">${remainMs>0 ? "No Show in "+Math.ceil(remainMs/1000)+"s" : "Mark No Show"}</span>
        </button>`;
    }
  }
  return `
  <div class="trip-item">
    <div class="date">Stop ${s.seq} &middot; ${s.name}</div>
    <div class="desc">${badge}${s.mapsUrl ? ` &middot; <a href="${s.mapsUrl}" target="_blank" rel="noopener">Open in Maps</a>` : ""}</div>
    <div class="trip-actions">${actions}</div>
  </div>`;
}
function transportCurrentCardHtml(){
  const list = transportTrips.current || [];
  if(!list.length) return "";
  return list.map(r=>{
    const allResolved = r.stops.every(s=>s.boardStatus!=="pending");
    return `
    <div class="card">
      <h2 class="section-title">🚌 ${r.direction==="pickup"?"Pickup":"Drop"} Trip &middot; ${r.clientName}</h2>
      <p class="muted">${r.vehicleReg||""}${r.totalDistanceKm!=null?" &middot; "+r.totalDistanceKm+" km":""} &middot; ${r.totalEmployees} employee${r.totalEmployees===1?"":"s"}</p>
      ${r.stops.map(s=>transportStopRowHtml(r.id, s)).join("")}
      <button class="big-btn" style="margin-top:14px;" ${(busy||!allResolved)?"disabled":""} onclick="completeTransportRoute('${r.id}')">
        ${busy?'<span class="spinner"></span>Saving...' : allResolved ? "Complete Trip" : "Resolve every stop to complete"}

// Report a vehicle problem straight to Workshop - lands with the Workshop
// Manager, who assigns it to a Mechanic/Electrician/Helper. Available any
// time there's an active shift, regardless of trip/odometer state.
let repairRequestsMine = [];
let repairSubmitting = false;
function repairRequestCardHtml(){
  const recent = repairRequestsMine.slice(0,5);
  const statusLabel = {requested:"Requested", assigned:"Assigned", in_progress:"In Progress", completed:"Completed", cancelled:"Cancelled"};
  return `

        <option value="normal">Normal</option>
        <option value="low">Low</option>
        <option value="high">High</option>
      </select>
    </div>

      <label>What's wrong?</label>
      <input type="text" id="rrIssueDriver" placeholder="e.g. Brake noise, AC not cooling, Adblue low" />
    </div>

    <div style="margin-top:12px;">
      <p class="muted" style="margin-bottom:6px;">Your recent requests:</p>
      ${recent.map(r=>`<div class="doc-row" style="display:block;"><b>${r.issueDescription}</b><br/><span class="muted">${statusLabel[r.status]||r.status}${r.assignedToName? ' - '+r.assignedToName:''}</span></div>`).join("")}
    </div>` : ""}

async function submitDriverRepairRequest(){
  if(repairSubmitting) return;
  const issueDescription = document.getElementById("rrIssueDriver").value;
  const urgency = document.getElementById("rrUrgencyDriver").value;
  if(!issueDescription || !issueDescription.trim()){ lastError = "Describe the problem before sending it to Workshop."; render(); return; }
  lastError = "";
  repairSubmitting = true; render();
  try{
    const r = await api("/driver-auth/repair-requests", {method:"POST", body: JSON.stringify({issueDescription, urgency})});
    repairRequestsMine.unshift(r);
  }catch(e){ lastError = e.message; }
  repairSubmitting = false; render();
}

// short-lived 6-digit code here and read it out to their Supervisor, who
// keys the reading in on their behalf after checking it. A ₹100 penalty is
// applied automatically the moment the Supervisor uses the code, since it

function manualEntryCodeCardHtml(){

// Always-available Logout from the Profile tab. If the shift is already
// closed out (or there's no shift), this fully signs the driver out via the
// backend, same as the swipe control. If the shift is still open (odometer
// not yet closed), we can't silently end it - the office needs that closing
// reading for mileage/fuel tracking - so this just clears the session on
// this device; the driver's shift stays active and boot() will pick right
// back up where they left off next time they log in (any device).
async function handleAccountLogout(){
  if(busy) return;
  if(shift && shift.status==="ready_to_logout"){ await doDriverLogout(); return; }
  if(shift && (shift.status==="awaiting_odometer" || shift.status==="on_trip")){
    const ok = confirm("Your shift is still open today (closing odometer reading not submitted). Sign out of this device now? Your shift will stay open so you can finish it later.");
    if(!ok) return;
  }
  resetSession();
  render();
}

async function submitWorkshopComplete(id){
  const workDone = (document.getElementById(`wsWd_${id}`)||{}).value || "";
  const names = document.querySelectorAll(`#wsParts_${id} .wsPartName`);
  const qtys = document.querySelectorAll(`#wsParts_${id} .wsPartQty`);
  const units = document.querySelectorAll(`#wsParts_${id} .wsPartUnit`);
  const costs = document.querySelectorAll(`#wsParts_${id} .wsPartCost`);
  const partsUsed = [];
  for(let i=0;i<names.length;i++){
    const name = names[i].value, cost = Number(costs[i].value)||0;
    if(name && cost>0) partsUsed.push({ name, qty: Number(qtys[i].value)||1, unit: units[i].value, cost });
  }
  if(!workDone.trim()){ alert("Describe the work that was done."); return; }
  if(!partsUsed.length){ alert("Add at least one part/consumable with its cost."); return; }
  if(workshopBusy) return;
  lastError = "";
  workshopBusy = true; render();
  try{
    await workshopApi(`/workshop-auth/repair-requests/${id}/complete`, {method:"PATCH", body: JSON.stringify({workDone, partsUsed})});
    await loadWorkshopTabData();
    workshopBusy = false; render();
    alert("Repair marked complete. A vehicle expense has been created and sent for approval.");
    return;
  }catch(e){ lastError = e.message; }
  workshopBusy = false; render();
}

// ---- Bulk Purchases (everyone in Workshop) ----
function workshopPurchasesTabHtml(){

    <p class="muted">Add each item you bought, the total amount, and a photo of the invoice.</p>
    <div id="wsPurchaseItemsRows">

      <div class="field left"><label>Qty</label><input type="number" step="0.1" class="wsItemQty" placeholder="e.g. 4" /></div>
      <div class="field left"><label>Unit</label><input type="text" class="wsItemUnit" placeholder="e.g. Litres" /></div>
    </div>
    <button class="big-btn secondary" type="button" onclick="addWorkshopPurchaseItemRow()">+ Add another item</button>
    <div class="field left" style="margin-top:12px;"><label>Total Amount (&#8377;)</label><input type="number" id="wsTotalAmount" /></div>
    <div class="field left"><label>Notes (optional)</label><input type="text" id="wsNotes" /></div>
    <div class="photo-box">
      ${pendingWorkshopInvoice ? `<img src="${pendingWorkshopInvoice}"/><br/>` : ""}
      <input type="file" id="wsInvoiceFileInput" accept="image/*,application/pdf" capture="environment" style="display:none" onchange="handleWorkshopInvoicePhoto(event)" />
      <button type="button" class="big-btn secondary" style="margin-top:${pendingWorkshopInvoice?'10px':'0'};" onclick="document.getElementById('wsInvoiceFileInput').click()">${pendingWorkshopInvoice? "📷 Retake Invoice Photo" : "📷 Attach Invoice Photo"}</button>
    </div>
    <button class="big-btn" ${workshopBusy?"disabled":""} onclick="submitWorkshopPurchaseMobile()">${workshopBusy?'<span class="spinner"></span>Saving...':"Log Purchase"}</button>
  </div>
  <div class="card">
    <h2 class="section-title">Your Recent Bulk Purchases</h2>
    ${workshopPurchases.length===0 ? `<div class="empty">No purchases logged yet.</div>` : workshopPurchases.slice(0,20).map(p=>`
      <div class="trip-item">
        <div class="date">${fmtDate(p.createdAt.slice(0,10))}</div>
        <div class="desc">${p.items.map(i=>`${i.qty}${i.unit?' '+i.unit:''} ${i.name}`).join(", ")}</div>
        <div class="meta">${money(p.totalAmount)}${p.invoiceUrl?` &middot; <a href="${p.invoiceUrl}" target="_blank">View invoice</a>`:''}</div>
      </div>`).join("")}
  </div>`;
}
function addWorkshopPurchaseItemRow(){
  const wrap = document.getElementById("wsPurchaseItemsRows");
  const frag = document.createElement("div");
  frag.innerHTML = `
    <div class="field left"><label>Item</label><input type="text" class="wsItemName" /></div>
    <div class="field left"><label>Qty</label><input type="number" step="0.1" class="wsItemQty" /></div>
    <div class="field left"><label>Unit</label><input type="text" class="wsItemUnit" /></div>`;
  while(frag.firstChild) wrap.appendChild(frag.firstChild);
}
function handleWorkshopInvoicePhoto(e){
  const file = e.target.files[0];
  e.target.value = "";
  if(!file) return;
  downscaleImage(file, 900, 0.8, (dataUrl)=>{ pendingWorkshopInvoice = dataUrl; render(); });
}
async function submitWorkshopPurchaseMobile(){
  const names = document.querySelectorAll("#wsPurchaseItemsRows .wsItemName");
  const qtys = document.querySelectorAll("#wsPurchaseItemsRows .wsItemQty");
  const units = document.querySelectorAll("#wsPurchaseItemsRows .wsItemUnit");
  const items = [];
  for(let i=0;i<names.length;i++){
    if(names[i].value) items.push({ name: names[i].value, qty: Number(qtys[i].value)||1, unit: units[i].value });
  }
  const totalAmount = Number((document.getElementById("wsTotalAmount")||{}).value);
  const notes = (document.getElementById("wsNotes")||{}).value || "";
  if(!items.length){ alert("Add at least one item purchased."); return; }
  if(!totalAmount || totalAmount<=0){ alert("Enter a valid total amount."); return; }
  if(!pendingWorkshopInvoice){ alert("Attach a photo of the invoice."); return; }
  if(workshopBusy) return;
  lastError = "";
  workshopBusy = true; render();
  try{
    await workshopApi("/workshop-auth/workshop-purchases", {method:"POST", body: JSON.stringify({items, totalAmount, invoice: pendingWorkshopInvoice, notes})});
    pendingWorkshopInvoice = null;
    await loadWorkshopTabData();
    workshopBusy = false; render();
    alert("Purchase logged.");
    return;
  }catch(e){ lastError = e.message; }
  workshopBusy = false; render();
}

  </div>
  <div class="card">
    <div class="ws-ai-chat-window" id="wsAiChatWindow">${messagesHtml}${wsChatBusy ? '<div class="ws-ai-msg assistant"><span class="ws-ai-tag">Fleet Assistant</span><span class="spinner"></span> Checking the data...</div>' : ''}</div>
    ${wsChatError ? `<div class="banner error">${wsChatError}</div>` : ''}

    <div class="ws-ai-input-row">
      <textarea id="wsAiChatInputBox" placeholder="Ask about mileage, documents, idle vehicles..." ${wsChatBusy?"disabled":""} onkeydown="if(event.key==='Enter' && !event.shiftKey){event.preventDefault(); sendWorkshopAiChatMessage();}"></textarea>
      <button class="big-btn" ${wsChatBusy?"disabled":""} onclick="sendWorkshopAiChatMessage()">${wsChatBusy?'<span class="spinner"></span>':'Send'}</button>

function askWorkshopAiSuggested(text){
  const box = document.getElementById("wsAiChatInputBox");
  if(box) box.value = text;
  sendWorkshopAiChatMessage();
}
async function sendWorkshopAiChatMessage(){
  const box = document.getElementById("wsAiChatInputBox");
  const text = (box && box.value || "").trim();
  if(!text || wsChatBusy) return;
  wsChatHistory.push({role:"user", content:text});
  wsChatBusy = true; wsChatError = "";
  render();
  scrollWorkshopAiChatToBottom();
  try{
    const res = await workshopApi("/workshop-auth/smart-assistant/query", {method:"POST", body: JSON.stringify({message:text})});
    wsChatHistory.push({role:"assistant", content: res.reply, tool: res.tool || ""});
  }catch(e){
    wsChatError = e.message;
  }
  wsChatBusy = false;
  render();
  scrollWorkshopAiChatToBottom();
}
function scrollWorkshopAiChatToBottom(){
  const w = document.getElementById("wsAiChatWindow");
  if(w) w.scrollTop = w.scrollHeight;
}

// Ticks the 10-minute countdown once a second WITHOUT a full re-render -
// updating the app's whole innerHTML every second was wiping out the
// odometer input as the driver typed into it (a fresh <input> with no
// value every tick left about one second to type before it reset). This
// only touches the countdown's own text/class, so the input (and its
// value, cursor position, focus) are never disturbed by the clock.
let odoExpiryHandled = false;
setInterval(()=>{
  if(!shift || shift.status!=="awaiting_odometer"){ odoExpiryHandled = false; return; }
  const el = document.getElementById("odoCountdown");
  if(!el) return; // this screen isn't the one currently on-screen right now
  const { remainMs, text } = odometerCountdownParts();
  el.textContent = text;
  el.classList.toggle("warn", remainMs < 120000);
  if(remainMs <= 0 && !odoExpiryHandled){
    odoExpiryHandled = true;
    refreshMe(); // picks up the server's auto-close and switches screens
  }
}, 1000);

// Same no-full-render approach for each pending stop's "No Show" grace
// countdown - ticks every "Mark No Show" button on screen once a second,
// flipping it enabled the moment 5 minutes have passed since arrival,
// without touching anything else on the page.
setInterval(()=>{
  document.querySelectorAll('[id^="noShowBtn_"]').forEach(btn=>{
    const arrivedAt = btn.getAttribute("data-arrived");
    if(!arrivedAt) return;
    const remainMs = Math.max(0, new Date(arrivedAt).getTime() + 5*60*1000 - Date.now());
    const label = document.getElementById(btn.id.replace("noShowBtn_","noShowLabel_"));
    if(label) label.textContent = remainMs>0 ? "No Show in "+Math.ceil(remainMs/1000)+"s" : "Mark No Show";
    btn.disabled = remainMs>0 || busy;
  });
}, 1000);
</script>
