<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Padmasri Travels - Client Transport Portal</title>
<meta name="theme-color" content="#2B2E1F" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@1,500;1,600;1,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root{
    --ink:#2B2E1F; --accent:#4C6A2B; --accent-dark:#3A5220; --accent-light:#E9EDA8; --green:#2E7D32;
    --amber:#b8860b; --red:#c0392b; --grey:#6b6b5e; --bg:#FBF8E3; --card:#ffffff;
    --border:#ECE6C8; --purple:#6C63FF; --purple-dark:#4A43C7; --purple-light:#E7E5FF;
    --on-accent:#ffffff; --on-accent-rgb:255,255,255; --accent-text:var(--accent);
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Poppins',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:#1a1a1a;}
  .accent-script{font-family:'Playfair Display',Georgia,serif;font-style:italic;font-weight:600;}
  #app{max-width:1080px;margin:0 auto;min-height:100vh;background:var(--bg);}
  header.topbar{background:var(--ink);color:#fff;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10;flex-wrap:wrap;gap:8px;}
  header.topbar .brand{font-weight:700;font-size:17px;}
  header.topbar .who{font-size:12.5px;opacity:.9;text-align:right;}
  header.topbar button.gear, header.topbar button.logout{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.35);color:#fff;padding:6px 12px;border-radius:8px;font-size:12px;cursor:pointer;margin-left:8px;}
  main{padding:18px 20px 70px;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px 18px;margin-bottom:16px;box-shadow:0 4px 14px rgba(43,46,31,.05);}
  h1.page-title{font-size:20px;margin:4px 0 16px;color:var(--ink);}
  h2.section-title{font-size:15px;margin:0 0 10px;color:var(--ink);border-bottom:2px solid var(--accent-light);padding-bottom:6px;}
  h3{font-size:14px;color:var(--ink);margin:0 0 8px;}
  .grid{display:grid;gap:14px;}
  .grid.cols-3{grid-template-columns:repeat(3,1fr);}
  .grid.cols-4{grid-template-columns:repeat(4,1fr);}
  @media(max-width:900px){.grid.cols-4{grid-template-columns:repeat(2,1fr);} .grid.cols-3{grid-template-columns:repeat(2,1fr);}}
  @media(max-width:520px){.grid.cols-4,.grid.cols-3{grid-template-columns:1fr;}}
  .kpi{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px;}
  .kpi .num{font-size:24px;font-weight:700;color:var(--ink);}
  .kpi .label{font-size:12px;color:var(--grey);margin-top:2px;}
  .kpi.good .num{color:var(--green);} .kpi.bad .num{color:var(--red);} .kpi.warn .num{color:var(--amber);}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  table th{text-align:left;background:var(--accent-light);color:var(--ink);padding:8px 10px;font-size:12px;}
  table td{padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:middle;}
  .badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600;}
  .badge.pending{background:#FBF3D6;color:var(--amber);}
  .badge.approved{background:#E9F3DC;color:var(--green);}
  .badge.rejected,.badge.cancelled{background:#fbe4e1;color:var(--red);}
  .badge.draft{background:#eee;color:var(--grey);}
  .badge.dispatched{background:var(--purple-light);color:var(--purple-dark);}
  .badge.flag{background:#fbe4e1;color:var(--red);}
  .login-wrap{max-width:420px;margin:60px auto;padding:0 16px;}
  .login-wrap .logo{text-align:center;font-size:22px;font-weight:800;color:var(--ink);margin-bottom:4px;}
  .login-wrap .sub{text-align:center;color:var(--grey);font-size:13px;margin-bottom:22px;}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:12px;color:var(--grey);margin-bottom:4px;}
  .field input,.field select,.field textarea{width:100%;padding:9px 10px;border:1px solid var(--border);border-radius:10px;font-size:14px;font-family:inherit;}
  .btn{background:var(--accent);color:var(--on-accent);border:none;padding:9px 16px;border-radius:8px;font-size:13.5px;cursor:pointer;font-weight:600;}
  .btn:hover{background:var(--accent-dark);}
  .btn.secondary{background:#fff;color:var(--accent-text);border:1px solid var(--accent-text);}
  .btn.danger{background:var(--red);color:#fff;}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  .btn.small{padding:5px 10px;font-size:12px;}
  .banner{background:#FBF3D6;border:1px solid #EBDA9B;color:#7a5a00;padding:10px 14px;border-radius:10px;font-size:12.5px;margin-bottom:16px;}
  .banner.error{background:#fbe4e1;border-color:#eab3ab;color:#7a2115;}
  .muted{color:var(--grey);font-size:12px;}
  .empty{text-align:center;color:var(--grey);padding:30px 10px;font-size:13px;}
  .footer-note{font-size:11px;color:#9a9576;text-align:center;padding:20px;}
  .portal-pick{display:grid;gap:14px;grid-template-columns:1fr 1fr;max-width:520px;margin:60px auto;padding:0 16px;}
  @media(max-width:560px){.portal-pick{grid-template-columns:1fr;}}
  .portal-pick .pcard{background:#fff;border:2px solid var(--border);border-radius:16px;padding:22px 16px;text-align:center;cursor:pointer;}
  .portal-pick .pcard:hover{border-color:var(--accent);}
  .portal-pick .pcard .picon{font-size:30px;margin-bottom:8px;}
  .portal-pick .pcard .ptitle{font-weight:700;color:var(--ink);margin-bottom:4px;}
  .portal-pick .pcard .pdesc{font-size:12px;color:var(--grey);}
  .tabbar{display:flex;gap:8px;overflow-x:auto;padding:10px 20px;background:#fff;border-bottom:1px solid var(--border);position:sticky;top:56px;z-index:9;}
  .tabbar button{flex:0 0 auto;background:#fff;border:1px solid var(--border);color:var(--grey);padding:8px 14px;border-radius:20px;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap;}
  .tabbar button.active{background:var(--accent);border-color:var(--accent);color:var(--on-accent);}
  .stop-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);}
  .stop-row:last-child{border-bottom:none;}
  .stop-num{width:26px;height:26px;border-radius:50%;background:var(--accent-light);color:var(--ink);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex:0 0 auto;}
  #pinMap{height:320px;border-radius:14px;overflow:hidden;border:1px solid var(--border);margin-bottom:10px;}
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px;}
  .modal-box{background:var(--card);border-radius:16px;padding:20px;max-width:360px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.25);}
  .theme-swatch{width:38px;height:38px;border-radius:50%;cursor:pointer;}
</style>
</head>
<body>
<div id="app"></div>
<div id="themeOverlay"></div>
<script>
const EMP_API = "/api/client-employee-auth";
const STAFF_API = "/api/client-auth";

let portalKind = localStorage.getItem("clientPortalKind") || null; // "employee" | "staff"
let empToken = localStorage.getItem("clientEmpToken") || null;
let employee = null, empClient = null;
let staffToken = localStorage.getItem("clientStaffToken") || null;
let staffUser = null, staffClient = null;
let lastError = "";
let pwChangeError = "";
let empTab = "home";
let staffTab = null;
let myRoute = { routes: [] };
let myRequests = [];
let _selectedBookingDates = [];
let _bookingType = "both";
let busy = false;
let showThemeModal = false;

// ---------- theme (fixed brand-color picker, mirrors server.js) ----------
const THEME_PRESETS = {
  teal:   { key:"teal",   label:"Teal",          accent:"#00A3A6", text:"#FFFFFF" },
  lime:   { key:"lime",   label:"Lime",          accent:"#D7E600", text:"#1A1A1A" },
  maroon: { key:"maroon", label:"Maroon",        accent:"#722F37", text:"#FFFFFF" },
  gold:   { key:"gold",   label:"Golden Yellow", accent:"#FFC107", text:"#1A1A1A" },
  black:  { key:"black",  label:"Black",         accent:"#000000", text:"#FFFFFF" },
  white:  { key:"white",  label:"White",         accent:"#FFFFFF", text:"#1A1A1A" },
};
function hexToRgbC(hex){
  const h = hex.replace("#","");
  const n = h.length===3 ? h.split("").map(c=>c+c).join("") : h;
  const int = parseInt(n,16);
  return { r:(int>>16)&255, g:(int>>8)&255, b:int&255 };
}
function shadeHexC(hex, pct){
  const {r,g,b} = hexToRgbC(hex);
  const f = pct<0 ? 0 : 255, p = Math.abs(pct);
  const nr = Math.round((f-r)*p)+r, ng = Math.round((f-g)*p)+g, nb = Math.round((f-b)*p)+b;
  return "#"+[nr,ng,nb].map(x=>Math.max(0,Math.min(255,x)).toString(16).padStart(2,"0")).join("");
}
function applyTheme(themeKey){
  const root = document.documentElement.style;
  if(!themeKey || !THEME_PRESETS[themeKey]){
    root.removeProperty("--accent"); root.removeProperty("--accent-dark"); root.removeProperty("--accent-light");
    root.removeProperty("--on-accent"); root.removeProperty("--on-accent-rgb"); root.removeProperty("--accent-text");
    try{ localStorage.removeItem("themeKey"); }catch(e){}
    return;
  }
  const preset = THEME_PRESETS[themeKey];
  const { r, g, b } = hexToRgbC(preset.text);
  root.setProperty("--accent", preset.accent);
  root.setProperty("--accent-dark", shadeHexC(preset.accent, -0.2));
  root.setProperty("--accent-light", shadeHexC(preset.accent, 0.75));
  root.setProperty("--on-accent", preset.text);
  root.setProperty("--on-accent-rgb", `${r},${g},${b}`);
  root.setProperty("--accent-text", preset.accent);
  try{ localStorage.setItem("themeKey", themeKey); }catch(e){}
}
(function(){
  try{ const saved = localStorage.getItem("themeKey"); if(saved && THEME_PRESETS[saved]) applyTheme(saved); }catch(e){}
})();
function toggleThemeModal(){ showThemeModal = !showThemeModal; render(); }
async function saveTheme(key){
  try{
    if(portalKind==="employee"){
      const r = await empApi("/theme", {method:"POST", body: JSON.stringify({theme:key})});
      employee.theme = r.theme;
    } else {
      const r = await staffApi("/theme", {method:"POST", body: JSON.stringify({theme:key})});
      staffUser.theme = r.theme;
    }
    applyTheme(key); render();
  }catch(e){ alert(e.message||"Could not update theme."); }
}
async function resetTheme(){ await saveTheme(null); }
function themeModalHtml(){
  if(!showThemeModal) return "";
  const current = portalKind==="employee" ? (employee && employee.theme && employee.theme.key) : (staffUser && staffUser.theme && staffUser.theme.key);
  const swatches = Object.values(THEME_PRESETS).map(p=>{
    const sel = p.key===current;
    return `<button type="button" class="theme-swatch" onclick="saveTheme('${p.key}')" title="${p.label}" style="background:${p.accent};border:${sel?"3px solid var(--ink)":"1px solid var(--border)"};box-shadow:${sel?"0 0 0 2px #fff inset":"none"};"></button>`;
  }).join("");
  return `<div class="modal-overlay" onclick="if(event.target===this) toggleThemeModal()">
    <div class="modal-box">
      <h3>Theme</h3>
      <p class="muted" style="margin-bottom:10px;">Pick an accent color for your account.</p>
      <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;">${swatches}</div>
      <div style="margin-top:16px;display:flex;justify-content:flex-end;gap:8px;">
        <button type="button" class="btn secondary" onclick="resetTheme()">Reset</button>
        <button type="button" class="btn" onclick="toggleThemeModal()">Done</button>
      </div>
    </div>
  </div>`;
}

// ---------- API helpers ----------
async function empApi(path, opts){
  opts = opts || {};
  opts.headers = Object.assign({"Content-Type":"application/json"}, opts.headers||{}, empToken ? {Authorization:"Bearer "+empToken} : {});
  const res = await fetch(EMP_API+path, opts);
  const data = await res.json().catch(()=>({}));
  if(res.status===401){ empLogout(true); throw new Error("Session expired - please log in again."); }
  if(!res.ok) throw new Error(data.error || "Something went wrong.");
  return data;
}
async function staffApi(path, opts){
  opts = opts || {};
  opts.headers = Object.assign({"Content-Type":"application/json"}, opts.headers||{}, staffToken ? {Authorization:"Bearer "+staffToken} : {});
  const res = await fetch(STAFF_API+path, opts);
  const data = await res.json().catch(()=>({}));
  if(res.status===401){ staffLogout(true); throw new Error("Session expired - please log in again."); }
  if(!res.ok) throw new Error(data.error || "Something went wrong.");
  return data;
}

// ---------- boot ----------
async function boot(){
  if(portalKind==="employee" && empToken){
    try{
      const m = await empApi("/me");
      employee = m.employee; empClient = m.client;
      applyTheme(employee.theme && employee.theme.key);
      await Promise.all([loadMyRoute(), loadMyRequests()]);
    }catch(e){ /* handled by empApi */ }
  } else if(portalKind==="staff" && staffToken){
    try{
      const m = await staffApi("/me");
      staffUser = m.user; staffClient = m.client;
      applyTheme(staffUser.theme && staffUser.theme.key);
      if(staffUser.mustChangePassword){ render(); return; }
      staffTab = defaultStaffTab(staffUser.role);
    }catch(e){ /* handled by staffApi */ }
  }
  render();
}
function defaultStaffTab(role){
  if(role==="travel_desk_manager") return "roster";
  if(role==="billing") return "billing";
  return "overview";
}
function chooseEmployeePortal(){ portalKind="employee"; localStorage.setItem("clientPortalKind","employee"); render(); }
function chooseStaffPortal(){ portalKind="staff"; localStorage.setItem("clientPortalKind","staff"); render(); }
function backToChooser(){ portalKind=null; localStorage.removeItem("clientPortalKind"); lastError=""; render(); }

function empLogout(silent){
  empToken=null; employee=null; empClient=null;
  localStorage.removeItem("clientEmpToken");
  if(!silent) empApi("/logout", {method:"POST"}).catch(()=>{});
  render();
}
function staffLogout(silent){
  staffToken=null; staffUser=null; staffClient=null;
  localStorage.removeItem("clientStaffToken");
  if(!silent) staffApi("/logout", {method:"POST"}).catch(()=>{});
  render();
}

// ---------- employee login ----------
async function doEmployeeLogin(){
  if(busy) return;
  lastError="";
  const phone = (document.getElementById("empPhone")||{}).value || "";
  const pin = (document.getElementById("empPin")||{}).value || "";
  if(!phone.trim() || !pin.trim()){ lastError="Enter your mobile number and PIN."; render(); return; }
  busy=true; render();
  try{
    const r = await empApi("/login", {method:"POST", body: JSON.stringify({phone:phone.trim(), pin:pin.trim()})});
    empToken = r.token; employee = r.employee;
    localStorage.setItem("clientEmpToken", empToken);
    applyTheme(employee.theme && employee.theme.key);
    await Promise.all([loadMyRoute(), loadMyRequests()]);
    busy=false; render();
  }catch(e){ busy=false; lastError=e.message; render(); }
}
// ---------- staff login ----------
async function doStaffLogin(){
  if(busy) return;
  lastError="";
  const identifier = (document.getElementById("staffIdentifier")||{}).value || "";
  const password = (document.getElementById("staffPassword")||{}).value || "";
  if(!identifier.trim() || !password){ lastError="Enter your email/mobile and password."; render(); return; }
  busy=true; render();
  try{
    const r = await staffApi("/login", {method:"POST", body: JSON.stringify({identifier:identifier.trim(), password})});
    staffToken = r.token; staffUser = r.user;
    localStorage.setItem("clientStaffToken", staffToken);
    if(!staffUser.mustChangePassword){
      const m = await staffApi("/me");
      staffClient = m.client;
      applyTheme(staffUser.theme && staffUser.theme.key);
      staffTab = defaultStaffTab(staffUser.role);
    }
    busy=false; render();
  }catch(e){ busy=false; lastError=e.message; render(); }
}
async function submitStaffPasswordChange(){
  pwChangeError="";
  const currentPassword = (document.getElementById("spwCurrent")||{}).value || "";
  const newPassword = (document.getElementById("spwNew")||{}).value || "";
  const confirm = (document.getElementById("spwConfirm")||{}).value || "";
  if(newPassword !== confirm){ pwChangeError="New password and confirmation don't match."; render(); return; }
  try{
    await staffApi("/change-password", {method:"POST", body: JSON.stringify({currentPassword, newPassword})});
    const m = await staffApi("/me");
    staffUser = m.user; staffClient = m.client;
    staffTab = defaultStaffTab(staffUser.role);
    render();
  }catch(e){ pwChangeError = e.message; render(); }
}

// ---------- employee data loaders ----------
async function loadMyRoute(){ try{ myRoute = await empApi("/my-route"); }catch(e){ myRoute = {routes:[]}; } }
async function loadMyRequests(){ try{ myRequests = await empApi("/requests"); }catch(e){ myRequests = []; } }
async function raiseRequest(type){
  try{
    await empApi("/requests", {method:"POST", body: JSON.stringify({type})});
    await loadMyRequests();
    render();
  }catch(e){ alert(e.message); }
}
async function cancelRequest(id){
  try{ await empApi("/requests/"+id+"/cancel", {method:"POST"}); await loadMyRequests(); render(); }
  catch(e){ alert(e.message); }
}

// ---------- location pin (Leaflet) ----------
let _pinMap = null, _pinMarker = null, _pinLatLng = employee ? null : null;
function setEmpTab(tab){
  empTab = tab; render();
  if(tab==="location") setTimeout(initPinMap, 0);
}
function initPinMap(){
  const el = document.getElementById("pinMap");
  if(!el || typeof L==="undefined") return;
  if(_pinMap){ _pinMap.remove(); _pinMap=null; }
  const startLat = (employee && employee.homeLat) || 17.4;
  const startLng = (employee && employee.homeLng) || 78.45;
  const map = L.map(el).setView([startLat, startLng], employee && employee.homeLat!=null ? 15 : 11);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {attribution:'&copy; OpenStreetMap contributors', maxZoom:19}).addTo(map);
  _pinMap = map;
  if(employee && employee.homeLat!=null){
    _pinLatLng = {lat:employee.homeLat, lng:employee.homeLng};
    _pinMarker = L.marker([employee.homeLat, employee.homeLng], {draggable:true}).addTo(map);
    _pinMarker.on('dragend', ()=>{ const p = _pinMarker.getLatLng(); _pinLatLng = {lat:p.lat,lng:p.lng}; });
  }
  map.on('click', (ev)=>{
    _pinLatLng = {lat:ev.latlng.lat, lng:ev.latlng.lng};
    if(_pinMarker) _pinMarker.setLatLng(ev.latlng);
    else { _pinMarker = L.marker(ev.latlng, {draggable:true}).addTo(map); _pinMarker.on('dragend', ()=>{ const p=_pinMarker.getLatLng(); _pinLatLng={lat:p.lat,lng:p.lng}; }); }
  });
  setTimeout(()=>map.invalidateSize(), 150);
}
function useMyGpsLocation(){
  if(!navigator.geolocation){ alert("Your browser doesn't support GPS location."); return; }
  navigator.geolocation.getCurrentPosition((pos)=>{
    const lat = pos.coords.latitude, lng = pos.coords.longitude;
    _pinLatLng = {lat,lng};
    if(_pinMap){
      _pinMap.setView([lat,lng], 16);
      if(_pinMarker) _pinMarker.setLatLng([lat,lng]);
      else { _pinMarker = L.marker([lat,lng], {draggable:true}).addTo(_pinMap); _pinMarker.on('dragend', ()=>{ const p=_pinMarker.getLatLng(); _pinLatLng={lat:p.lat,lng:p.lng}; }); }
    }
  }, ()=>alert("Couldn't get your location - check location permissions."), {enableHighAccuracy:true, timeout:8000});
}
async function saveMyLocation(){
  if(!_pinLatLng){ alert("Tap the map (or use 'Use my current location') to drop a pin first."); return; }
  const address = (document.getElementById("pinAddress")||{}).value || "";
  try{
    const r = await empApi("/location", {method:"POST", body: JSON.stringify({lat:_pinLatLng.lat, lng:_pinLatLng.lng, address})});
    employee = r;
    alert("Location saved.");
    render();
  }catch(e){ alert(e.message); }
}

function render(){
  const app = document.getElementById("app");
  const overlay = document.getElementById("themeOverlay");
  overlay.innerHTML = themeModalHtml();
  if(!portalKind){ app.innerHTML = portalChooserHtml(); return; }
  if(portalKind==="employee"){
    if(!empToken || !employee){ app.innerHTML = employeeLoginHtml(); return; }
    app.innerHTML = empTopbarHtml() + empTabbarHtml() + `<main>${empBodyHtml()}</main>` + footerHtml();
    return;
  }
  if(portalKind==="staff"){
    if(!staffToken || !staffUser){ app.innerHTML = staffLoginHtml(); return; }
    if(staffUser.mustChangePassword){ app.innerHTML = staffForcedPasswordChangeHtml(); return; }
    app.innerHTML = staffTopbarHtml() + staffTabbarHtml() + `<main>${staffBodyHtml()}</main>` + footerHtml();
    return;
  }
}
function switchPortal(){ if(portalKind==='employee') empLogout(true); else staffLogout(true); backToChooser(); }
function footerHtml(){ return `<div class="footer-note">Padmasri Travels &middot; Employee Transport Portal &middot; <a href="javascript:void(0)" onclick="switchPortal()" style="color:var(--grey);">Switch portal</a></div>`; }
function errorBannerHtml(){ return lastError ? `<div class="banner error">${lastError}</div>` : ""; }

function portalChooserHtml(){
  return `
  <div class="portal-pick">
    <div class="pcard" onclick="chooseEmployeePortal()">
      <div class="picon">🧑‍💼</div>
      <div class="ptitle">I'm an Employee</div>
      <div class="pdesc">Pin your location, request a ride, see your assigned vehicle &amp; driver.</div>
    </div>
    <div class="pcard" onclick="chooseStaffPortal()">
      <div class="picon">🏢</div>
      <div class="ptitle">Client Staff</div>
      <div class="pdesc">Travel Desk Manager, Billing, or HOD - manage the roster, routes, and costing.</div>
    </div>
  </div>
  <div class="footer-note">Padmasri Travels &middot; Employee Transport Portal</div>`;
}
function employeeLoginHtml(){
  return `
  <div class="login-wrap">
    <div class="logo">🚌 Padmasri <span class="accent-script">Travels</span></div>
    <div class="sub">Employee Transport - sign in with your mobile number and PIN</div>
    ${errorBannerHtml()}
    <div class="card">

    ` : `

  </div>

    <h2 class="section-title">Book in Advance</h2>

    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;">
      <div class="field" style="max-width:200px;"><label>Date</label><input type="date" id="empBookDate" min="${today}" max="${maxDate}" /></div>
      <div class="field" style="max-width:160px;"><label>Type</label>
        <select id="empBookType" onchange="_bookingType=this.value;">
          <option value="pickup" ${_bookingType==='pickup'?'selected':''}>Pickup</option>
          <option value="drop" ${_bookingType==='drop'?'selected':''}>Drop</option>
          <option value="both" ${_bookingType==='both'?'selected':''}>Both</option>
        </select>
      </div>
      <button class="btn secondary" ${!employee.homeLat?"disabled":""} onclick="addBookingDate()">+ Add Date</button>
    </div>
    ${_selectedBookingDates.length ? `
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;">
        ${_selectedBookingDates.map(d=>`<span class="badge" style="cursor:pointer;" onclick="removeBookingDate('${d}')">${new Date(d).toLocaleDateString()} &times;</span>`).join("")}
      </div>
      <button class="btn" style="margin-top:10px;" onclick="submitAdvanceBookings()">Book ${_selectedBookingDates.length} Selected Date${_selectedBookingDates.length===1?'':'s'}</button>
    ` : ""}
  </div>

  ${upcoming.length ? `<div class="card"><h2 class="section-title">Upcoming Bookings</h2><table><tr><th>Date</th><th>Type</th><th>Status</th><th></th></tr>
    ${upcoming.map(r=>`<tr><td>${new Date(r.date).toLocaleDateString()}</td><td>${r.type}</td><td><span class="badge ${r.status}">${r.status}</span></td><td><button class="btn small danger" onclick="cancelRequest('${r.id}')">Cancel</button></td></tr>`).join("")}

  </table></div>` : ""}`;
}
function addBookingDate(){
  const el = document.getElementById('empBookDate');
  const date = el ? el.value : '';
  if(!date){ alert('Pick a date first.'); return; }
  if(!_selectedBookingDates.includes(date)){ _selectedBookingDates.push(date); _selectedBookingDates.sort(); }
  render();
}
function removeBookingDate(date){
  _selectedBookingDates = _selectedBookingDates.filter(d=>d!==date);
  render();
}
async function submitAdvanceBookings(){
  if(!_selectedBookingDates.length) return;
  try{
    const res = await empApi("/requests/bulk", {method:"POST", body: JSON.stringify({type:_bookingType, dates:_selectedBookingDates})});
    _selectedBookingDates = [];
    await loadMyRequests();
    if(res.skipped && res.skipped.length){
      alert(`Booked ${res.created.length} date(s). ${res.skipped.length} skipped: `+res.skipped.map(s=>s.date+' - '+s.reason).join(', '));
    }
    render();
  }catch(e){ alert(e.message); }
}

    <h2 class="section-title">By Seater Type</h2>
    <table><tr><th>Tier</th><th>Routes</th><th>Rate/route</th><th>Daily cost</th></tr>
    ${rows.map(t=>`<tr><td>${t.tier}-seater</td><td>${t.routeCount}</td><td>₹${t.ratePerRoute}</td><td>₹${t.dailyCost}</td></tr>`).join("")}
    </table>
  </div>`;
}

// -- HOD overview --
let overviewData = null;
async function loadOverview(){ try{ overviewData = await staffApi("/overview"); render(); }catch(e){} }
function overviewTabHtml(){
  if(!overviewData) return `<h1 class="page-title">Overview</h1><div class="empty">Loading...</div>`;
  return `
  <h1 class="page-title">Transport Overview</h1>
  <div class="grid cols-4">
    <div class="kpi"><div class="num">${overviewData.totalEmployees}</div><div class="label">Total employees</div></div>
    <div class="kpi good"><div class="num">${overviewData.employeesWithLocation}</div><div class="label">Location pinned</div></div>
    <div class="kpi warn"><div class="num">${overviewData.pendingRequests}</div><div class="label">Pending requests</div></div>
    <div class="kpi"><div class="num">${overviewData.occupancy.averageOccupancyRatio}%</div><div class="label">Fleet occupancy</div></div>
  </div>`;
}

function staffSettingsHtml(){
  return `
  <h1 class="page-title">Settings</h1>
  <div class="card">
    <h2 class="section-title">Account</h2>
    <p><b>${staffUser.name}</b><br/><span class="muted">${roleLabel(staffUser.role)} &middot; ${staffUser.email||staffUser.phone}</span></p>
  </div>
  <div class="card">
    <h3 style="margin-top:0;">Theme</h3>
    <button class="btn secondary" onclick="toggleThemeModal()">Choose Theme</button>
  </div>`;
}

boot();
</script>
