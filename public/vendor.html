<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Padmasri Travels - Vendor Portal</title>
<meta name="theme-color" content="#3E0B07" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@1,500;1,600;1,700&display=swap" rel="stylesheet">
<style>
  :root{
    /* Console design language - see index.html for the full note. Same
       tokens as the staff app so the vendor portal reads as part of the
       same product. */
    --ink:#1A1A18; --accent:#006643; --accent-dark:#004D33; --accent-light:#E1F0EA; --green:#2E7D32;
    --amber:#B8860B; --red:#C0392B; --grey:#6B6B62; --bg:#F6F6F2; --card:#ffffff;
    --border:#E6E3DB; --purple:#6C63FF; --purple-dark:#4A43C7; --purple-light:#E7E5FF;
    --gold:#C9A227; --gold-light:#F6ECD2; --wordmark:#7A2115;
    --label-track:.09em; --label-size:11px;
    --on-accent:#ffffff; --on-accent-rgb:255,255,255; --accent-text:var(--accent);
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Figtree','Poppins',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);}
  .accent-script{font-family:'Playfair Display',Georgia,serif;font-style:italic;font-weight:600;}
  #app{max-width:1080px;margin:0 auto;min-height:100vh;background:var(--bg);}
  header.topbar{background:var(--card);color:var(--ink);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10;border-bottom:1px solid var(--border);}
  header.topbar .brand{font-weight:800;font-size:15px;display:flex;align-items:center;gap:8px;color:var(--wordmark);}
  header.topbar .who{font-size:var(--label-size);color:var(--grey);text-align:right;text-transform:uppercase;letter-spacing:var(--label-track);font-weight:700;}
  header.topbar button.logout{background:#FBEAE6;border:1px solid #F3C6BA;color:#B4491F;padding:7px 13px;border-radius:8px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;cursor:pointer;margin-left:10px;}
  main{padding:18px 20px 60px;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px 20px;margin-bottom:16px;box-shadow:none;}
  h1.page-title{font-size:21px;font-weight:800;margin:4px 0 16px;color:var(--ink);}
  h2.section-title{font-size:10.5px;margin:0 0 12px;color:var(--grey);border-bottom:1px solid var(--border);padding-bottom:8px;text-transform:uppercase;letter-spacing:var(--label-track);font-weight:800;}
  .grid{display:grid;gap:14px;}
  .grid.cols-4{grid-template-columns:repeat(4,1fr);}
  @media(max-width:900px){.grid.cols-4{grid-template-columns:repeat(2,1fr);}}
  @media(max-width:520px){.grid.cols-4{grid-template-columns:1fr;}}
  .kpi{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;}
  .kpi .num{font-size:24px;font-weight:800;color:var(--ink);}
  .kpi .label{font-size:var(--label-size);color:var(--grey);margin-top:5px;text-transform:uppercase;letter-spacing:var(--label-track);font-weight:700;}
  .kpi.good .num{color:var(--green);}
  .kpi.bad .num{color:var(--red);}
  .kpi.warn .num{color:var(--amber);}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  table th{text-align:left;background:transparent;color:var(--grey);padding:8px 10px;font-size:10.5px;text-transform:uppercase;letter-spacing:var(--label-track);font-weight:800;border-bottom:1px solid var(--border);}
  table td{padding:10px 10px;border-bottom:1px solid var(--border);vertical-align:middle;}
  .badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;border:1px solid transparent;}
  .badge.outstanding{background:#FBEAE6;color:var(--red);border-color:#F3C6BA;}
  .badge.settled{background:var(--accent-light);color:var(--accent);border-color:#CFE3D8;}
  .login-wrap{max-width:420px;margin:60px auto;}
  .login-wrap .logo{text-align:center;font-size:22px;font-weight:800;color:var(--ink);margin-bottom:4px;}
  .login-wrap .sub{text-align:center;color:var(--grey);font-size:13px;margin-bottom:22px;}
  .brand-logo{height:54px;width:auto;display:block;}
  .login-wrap .logo .brand-logo{height:64px;margin:0 auto;}
  header.topbar .brand .brand-logo,.topbar .brand .brand-logo{height:24px;}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:var(--label-size);color:var(--grey);margin-bottom:5px;text-transform:uppercase;letter-spacing:var(--label-track);font-weight:700;}
  .field input{width:100%;padding:9px 10px;border:1px solid var(--border);border-radius:9px;font-size:14px;font-family:inherit;}
  .btn{background:var(--accent);color:var(--on-accent);border:none;padding:9px 16px;border-radius:9px;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;cursor:pointer;}
  .btn:hover{background:var(--accent-dark);}
  .btn.secondary{background:#fff;color:var(--accent-text);border:1px solid var(--accent-text);}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  .banner{background:#FBF1DE;border:1px solid #EEDDB8;color:#8A5F16;padding:11px 15px;border-radius:10px;font-size:12.5px;margin-bottom:16px;}
  .banner.error{background:#FBEAE6;border-color:#F3C6BA;color:#A83B1C;}
  .muted{color:var(--grey);font-size:12px;}
  .empty{text-align:center;color:var(--grey);padding:30px 10px;font-size:13px;}
  .footer-note{font-size:11px;color:var(--grey);text-align:center;padding:20px;}
  header.topbar button.gear{background:var(--bg);border:1px solid var(--border);color:var(--ink);padding:6px 10px;border-radius:8px;font-size:14px;cursor:pointer;margin-left:10px;line-height:1;}
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px;}
  .modal-box{background:var(--card);border-radius:16px;padding:20px;max-width:360px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.25);}
  .modal-box h3{margin:0 0 10px;color:var(--ink);}
  .theme-swatch{width:38px;height:38px;border-radius:50%;cursor:pointer;}
</style>
</head>
<body>
<div id="app"></div>
<script>
const API = "/api/vendor-auth";
let vndToken = localStorage.getItem("fleetVendorToken") || null;
let vendor = null;
let dashboard = null;
let lastError = "";
let pwChangeError = "";
let showThemeModal = false;

// ---------- theme (fixed brand-color picker, mirrors server.js/index.html) ----------
const THEME_PRESETS = {
  teal:   { key:"teal",   label:"Teal",          accent:"#00A3A6", text:"#FFFFFF" },
  lime:   { key:"lime",   label:"Lime",          accent:"#D7E600", text:"#1A1A1A" },
  maroon: { key:"maroon", label:"Padma Sri Maroon", accent:"#5D110B", text:"#FFFFFF" },
  gold:   { key:"gold",   label:"Golden Yellow", accent:"#FFC107", text:"#1A1A1A" },
  black:  { key:"black",  label:"Black",         accent:"#000000", text:"#FFFFFF" },
  white:  { key:"white",  label:"White",         accent:"#FFFFFF", text:"#1A1A1A" },
};
function hexToRgbVnd(hex){
  const h = hex.replace("#","");
  const n = h.length===3 ? h.split("").map(c=>c+c).join("") : h;
  const int = parseInt(n,16);
  return { r:(int>>16)&255, g:(int>>8)&255, b:int&255 };
}
function shadeHexVnd(hex, pct){
  const {r,g,b} = hexToRgbVnd(hex);
  const f = pct<0 ? 0 : 255, p = Math.abs(pct);
  const nr = Math.round((f-r)*p)+r, ng = Math.round((f-g)*p)+g, nb = Math.round((f-b)*p)+b;
  return "#"+[nr,ng,nb].map(x=>Math.max(0,Math.min(255,x)).toString(16).padStart(2,"0")).join("");
}
function applyTheme(themeKey){
  const root = document.documentElement.style;
  if(!themeKey || !THEME_PRESETS[themeKey]){
    root.removeProperty("--accent");
    root.removeProperty("--accent-dark");
    root.removeProperty("--accent-light");
    root.removeProperty("--on-accent");
    root.removeProperty("--on-accent-rgb");
    root.removeProperty("--accent-text");
    try{ localStorage.removeItem("themeKey"); }catch(e){}
    return;
  }
  const preset = THEME_PRESETS[themeKey];
  const { r, g, b } = hexToRgbVnd(preset.text);
  root.setProperty("--accent", preset.accent);
  root.setProperty("--accent-dark", shadeHexVnd(preset.accent, -0.2));
  root.setProperty("--accent-light", shadeHexVnd(preset.accent, 0.75));
  root.setProperty("--on-accent", preset.text);
  root.setProperty("--on-accent-rgb", `${r},${g},${b}`);
  root.setProperty("--accent-text", preset.accent);
  try{ localStorage.setItem("themeKey", themeKey); }catch(e){}
}
(function(){
  try{
    const saved = localStorage.getItem("themeKey");
    if(saved && THEME_PRESETS[saved]) applyTheme(saved);
  }catch(e){}
})();
function toggleThemeModal(){ showThemeModal = !showThemeModal; render(); }
async function saveTheme(key){
  try{
    const updated = await api("/theme", {method:"POST", body:JSON.stringify({theme:key})});
    vendor.theme = updated.theme;
    applyTheme(key);
    render();
  }catch(e){ alert(e.message||"Could not update theme."); }
}
async function resetTheme(){
  try{
    const updated = await api("/theme", {method:"POST", body:JSON.stringify({theme:null})});
    vendor.theme = updated.theme;
    applyTheme(null);
    render();
  }catch(e){ alert(e.message||"Could not reset theme."); }
}
function themeModalHtml(){
  if(!showThemeModal) return "";
  const current = (vendor && vendor.theme && vendor.theme.key) || null;
  const swatches = Object.values(THEME_PRESETS).map(p=>{
    const sel = p.key===current;
    return `<button type="button" class="theme-swatch" onclick="saveTheme('${p.key}')" title="${p.label}" style="background:${p.accent};border:${sel?"3px solid var(--ink)":"1px solid var(--border)"};box-shadow:${sel?"0 0 0 2px #fff inset":"none"};"></button>`;
  }).join("");
  return `<div class="modal-overlay" onclick="if(event.target===this) toggleThemeModal()">
    <div class="modal-box">
      <h3>Theme</h3>
      <p class="muted" style="margin-bottom:10px;">Pick an accent color for your account.</p>
      <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;">${swatches}</div>
      <div style="margin-top:16px;display:flex;justify-content:flex-end;gap:8px;">
        <button type="button" class="btn secondary" onclick="resetTheme()">Reset</button>
        <button type="button" class="btn" onclick="toggleThemeModal()">Done</button>
      </div>
    </div>
  </div>`;
}

async function api(path, opts){
  opts = opts || {};
  opts.headers = Object.assign({"Content-Type":"application/json"}, opts.headers||{}, vndToken ? {Authorization:"Bearer "+vndToken} : {});
  const res = await fetch(API+path, opts);
  const data = await res.json().catch(()=>({}));
  if(res.status===401){ doLogout(true); throw new Error("Session expired - please log in again."); }
  if(!res.ok) throw new Error(data.error || "Something went wrong.");
  return data;
}

async function boot(){
  if(!vndToken){ renderLogin(); return; }
  try{
    vendor = await api("/me");
    applyTheme(vendor.theme && vendor.theme.key);
    if(vendor.mustChangePassword){ renderForcedPasswordChange(); return; }
    dashboard = await api("/dashboard");
    render();
  }catch(e){ doLogout(true); }
}

function doLogout(silent){
  vndToken = null; vendor = null; dashboard = null;
  localStorage.removeItem("fleetVendorToken");
  if(!silent) api("/logout", {method:"POST"}).catch(()=>{});
  renderLogin();
}

function renderLogin(){
  const app = document.getElementById("app");
  app.innerHTML = `
  <div class="login-wrap">
    <div class="logo"><img class="brand-logo" src="logo-mark.png" alt="Padma Sri Travels" /></div>
    <div class="sub">Vendor Portal</div>
    <div class="card">
      ${lastError ? `<div class="banner error">${lastError}</div>` : ""}
      <div class="field">
        <label>Email or Mobile Number</label>
        <input type="text" id="loginIdentifier" placeholder="you@example.com or your mobile number" autocomplete="username" />
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="loginPassword" placeholder="Your password" autocomplete="current-password" />
      </div>
      <button class="btn" style="width:100%" onclick="doLogin()" id="loginBtn">Sign in</button>
      <div class="muted" style="margin-top:14px;text-align:center;border-top:1px solid var(--border);padding-top:14px;">Not a vendor? <a href="/">Go to the Staff / Driver login</a> &middot; <a href="subvendor.html">Subvendor Portal</a> &middot; <a href="vehicleowner.html">Vehicle Owner Portal</a></div>
    </div>
  </div>`;
}
async function doLogin(){
  lastError = "";
  const identifier = document.getElementById("loginIdentifier").value.trim();
  const password = document.getElementById("loginPassword").value;
  if(!identifier || !password){ lastError = "Enter your email/mobile number and password."; renderLogin(); return; }
  const btn = document.getElementById("loginBtn");
  btn.disabled = true; btn.textContent = "Signing in...";
  try{
    const res = await fetch(API+"/login", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({identifier, password})});
    const data = await res.json();
    if(!res.ok) throw new Error(data.error || "Login failed");
    vndToken = data.token;
    localStorage.setItem("fleetVendorToken", vndToken);
    await boot();
  }catch(e){ lastError = e.message; renderLogin(); }
}

const PASSWORD_MIN_LENGTH = 9;
function passwordPolicyError(password){
  if(!password || password.length < PASSWORD_MIN_LENGTH) return `Password must be more than 8 characters (at least ${PASSWORD_MIN_LENGTH}).`;
  if(!/[a-zA-Z]/.test(password)) return "Password must include at least one letter.";
  if(!/[0-9]/.test(password)) return "Password must include at least one number.";
  if(!/[^a-zA-Z0-9]/.test(password)) return "Password must include at least one symbol (e.g. ! @ # $ %).";
  return null;
}
function renderForcedPasswordChange(){
  const app = document.getElementById("app");
  app.innerHTML = `
  <div class="login-wrap">
    <div class="logo"><img class="brand-logo" src="logo-mark.png" alt="Padma Sri Travels" /></div>
    <div class="sub">Set a new password to continue</div>
    <div class="card">
      <div class="banner">For security, you need to set your own password before you can use the portal${vendor && vendor.name ? ", " + vendor.name : ""}.</div>
      ${pwChangeError ? `<div class="banner error">${pwChangeError}</div>` : ""}
      <div class="field"><label>Current (Temporary) Password</label><input type="password" id="pwCurrent" autocomplete="current-password" /></div>
      <div class="field"><label>New Password</label><input type="password" id="pwNew" autocomplete="new-password" /></div>
      <div class="field"><label>Confirm New Password</label><input type="password" id="pwConfirm" autocomplete="new-password" /></div>
      <div class="muted" style="margin-bottom:10px;">Strong password: more than 8 characters, with letters, numbers and symbols.</div>
      <button class="btn" style="width:100%" onclick="submitForcedPasswordChange()" id="pwBtn">Set New Password</button>
      <button class="btn secondary" style="width:100%;margin-top:8px;" onclick="doLogout()">Log out instead</button>
    </div>
  </div>`;
}
async function submitForcedPasswordChange(){
  pwChangeError = "";
  const currentPassword = document.getElementById("pwCurrent").value;
  const newPassword = document.getElementById("pwNew").value;
  const confirm = document.getElementById("pwConfirm").value;
  if(newPassword !== confirm){ pwChangeError = "New password and confirmation don't match."; renderForcedPasswordChange(); return; }
  const policyErr = passwordPolicyError(newPassword);
  if(policyErr){ pwChangeError = policyErr; renderForcedPasswordChange(); return; }
  const btn = document.getElementById("pwBtn");
  btn.disabled = true; btn.textContent = "Saving...";
  try{
    await api("/change-password", {method:"POST", body: JSON.stringify({currentPassword, newPassword})});
    await boot();
  }catch(e){ pwChangeError = e.message; renderForcedPasswordChange(); }
}

// DD/MM/YYYY display for raw "YYYY-MM-DD" date strings from the API - matches
// the DD/MM/YYYY convention used across the staff and driver apps (see
// fmtDMY in index.html/driver.html).
function fmtDMY(dateStr){
  if(!dateStr) return "-";
  const m = String(dateStr).slice(0,10).match(/^(\d{4})-(\d{2})-(\d{2})$/);
  return m ? `${m[3]}/${m[2]}/${m[1]}` : String(dateStr);
}
function render(){
  const app = document.getElementById("app");
  const d = dashboard || {bills:[],totalBilled:0,payments:[],totalPaid:0,outstandingPayable:0};
  const billRows = d.bills.map(b=>`
    <tr>
      <td>${fmtDMY(b.date)}</td>
      <td>${b.category}</td>
      <td>${b.description}</td>
      <td>₹${b.amount}</td>
      <td>₹${b.paidAgainstBill}</td>
      <td><span class="badge ${b.outstanding>0?'outstanding':'settled'}">₹${b.outstanding}</span></td>
    </tr>`).join("");
  const paymentRows = d.payments.map(p=>`
    <tr>
      <td>${fmtDMY(p.date)}</td>
      <td>${p.mode}</td>
      <td>₹${p.amount}</td>
      <td>${p.note||""}</td>
    </tr>`).join("");

  app.innerHTML = `
  <header class="topbar">
    <div class="brand"><img class="brand-logo" src="logo-mark.png" alt="" /> Padmasri <span class="accent-script">Travels</span> - Vendor Portal</div>
    <div>
      <span class="who">${vendor ? vendor.name : ""}</span>
      <button class="gear" title="Theme" onclick="toggleThemeModal()">&#9881;</button>
      <button class="logout" onclick="doLogout()">Log out</button>
    </div>
  </header>
  ${themeModalHtml()}
  <main>
    <h1 class="page-title">Welcome, ${vendor ? vendor.name : ""}</h1>
    <div class="grid cols-4">
      <div class="kpi"><div class="num">${vendor ? vendor.category : "-"}</div><div class="label">Category</div></div>
      <div class="kpi"><div class="num">₹${d.totalBilled}</div><div class="label">Total billed</div></div>
      <div class="kpi good"><div class="num">₹${d.totalPaid}</div><div class="label">Total paid</div></div>
      <div class="kpi ${d.outstandingPayable>0?'bad':'good'}"><div class="num">₹${d.outstandingPayable}</div><div class="label">Outstanding payable</div></div>
    </div>

    <div class="card">
      <h2 class="section-title">Your Bills / Invoices</h2>
      <table><tr><th>Date</th><th>Category</th><th>Description</th><th>Billed</th><th>Paid</th><th>Outstanding</th></tr>
      ${billRows || "<tr><td colspan='6' class='empty'>No bills recorded yet.</td></tr>"}</table>
    </div>

    <div class="card">
      <h2 class="section-title">Payments Received From Us</h2>
      <table><tr><th>Date</th><th>Mode</th><th>Amount</th><th>Note</th></tr>
      ${paymentRows || "<tr><td colspan='4' class='empty'>No payments recorded yet.</td></tr>"}</table>
    </div>

    <div class="footer-note">Padmasri Travels &middot; Vendor Portal</div>
  </main>`;
}

Object.assign(window, {doLogin, doLogout, submitForcedPasswordChange, toggleThemeModal, saveTheme, resetTheme});
boot();
</script>
</body>
</html>
